# Self-assessment against Home Assistant's Integration Quality Scale.
#
# This is a custom (HACS) integration, so `quality_scale` is deliberately
# absent from manifest.json — that key is meaningful for core integrations
# only, and hassfest skips this file entirely for non-core integrations
# (`script/hassfest/quality_scale.py`, `validate_iqs_file`: `if not
# integration.core: return`). It is kept here as an honest, reviewable
# statement of where the integration actually stands, in the format core
# uses, so the gaps are visible instead of implied.
#
# Statuses: done | todo | exempt (with a reason).

rules:
  # Bronze
  action-setup:
    status: exempt
    comment: >-
      No integration-level actions are registered. The legacy
      notify.airplay_<name> service is created by core's notify platform
      machinery from a config entry, and the modern surface is an entity
      service owned by the notify component.
  appropriate-polling:
    status: exempt
    comment: The integration never polls; it has no coordinator and no data to fetch.
  brands:
    status: todo
    comment: >-
      The icon is bundled under brand/ and the HACS brands check is
      enabled, but nothing has been merged into home-assistant/brands yet,
      so Home Assistant still shows the default integration icon.
  common-modules:
    status: done
    comment: >-
      Delivery logic lives in delivery.py, entry plumbing in __init__.py,
      constants in const.py. No coordinator is applicable.
  config-flow:
    status: done
    comment: >-
      UI setup with an entity selector per field; every field has a
      data_description in strings.json.
  config-flow-test-coverage:
    status: done
    comment: >-
      tests/test_config_flow.py covers the user step and its refusals, the
      duplicate abort, the reconfigure step and the options flow.
  dependency-transparency:
    status: done
    comment: No third-party requirements at all; everything used is Home Assistant core.
  docs-actions:
    status: done
    comment: README documents the legacy service and its per-call data payload.
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
    comment: HACS custom-repository instructions in the README.
  docs-removal-instructions:
    status: done
    comment: >-
      README section covering entry deletion, HACS removal, and what is
      left behind (nothing, beyond references to a deleted notify
      service).
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: The entity subscribes to nothing; it is write-only.
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
    comment: >-
      _attr_has_entity_name with _attr_name = None; one service device per
      entry provides the name.
  runtime-data:
    status: done
    comment: >-
      entry.runtime_data holds AirplayNotifierRuntimeData; nothing is stored
      in hass.data by this integration.
  test-before-configure:
    status: done
    comment: >-
      The user step refuses a media_player whose supported_features
      excludes PLAY_MEDIA, and the options step refuses the Music Assistant
      strategy on a player the entity registry attributes to another
      integration. Both are permissive when the evidence is absent (no
      state, no registry entry). The TTS engine is not exercised: there is
      no way to ask an engine to synthesize without actually synthesizing
      and playing something.
  test-before-setup:
    status: done
    comment: >-
      async_setup_entry raises ConfigEntryNotReady, naming every missing
      entity, when the media_player or the TTS entity is absent from the
      state machine. Only absence defers setup: an unavailable target
      still loads, so the entity that reports that unavailability exists.
  unique-config-entry:
    status: done
    comment: unique_id is the target media_player entity id; a second entry aborts.

  # Silver
  action-exceptions:
    status: done
    comment: >-
      Refusals raise ServiceValidationError (deny-list, invalid call data,
      quiet hours) and delivery failures raise HomeAssistantError, both
      with translation keys from the exceptions section of strings.json.
  config-entry-unloading:
    status: done
    comment: >-
      Platforms are unloaded, the legacy notify service is removed together
      with its instance in hass.data, and a pending volume restore is
      performed immediately (inside the lock, best effort) before its timer
      is cancelled — so an options reload during an announcement cannot
      leave the speaker stuck at announcement volume.
  docs-configuration-parameters:
    status: done
    comment: >-
      Options table in the README, quiet hours explained with its
      precedence rules, and a data_description for every field.
  docs-installation-parameters:
    status: done
  entity-unavailable:
    status: done
    comment: >-
      The notify entity tracks both targets with
      async_track_state_change_event and is unavailable while either is
      missing or unavailable.
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
    comment: >-
      One INFO line when a target goes away and one when it comes back;
      logged on the transition only, so a flapping or noisy target does not
      repeat the line.
  parallel-updates:
    status: exempt
    comment: >-
      No polling and no update coordinator. Concurrent announcements on one
      player are serialised by VolumeRestoreState.lock, not by
      PARALLEL_UPDATES.
  reauthentication-flow:
    status: exempt
    comment: There is nothing to authenticate against.
  test-coverage:
    status: done
    comment: 100 % statement coverage over the integration; CI gate at 85 %.

  # Gold
  devices:
    status: done
    comment: One service device per config entry.
  diagnostics:
    status: done
  discovery:
    status: exempt
    comment: >-
      There is nothing on the network to discover; the entry is a
      user-chosen pairing of an existing media_player and an existing TTS
      engine.
  discovery-update-info:
    status: exempt
    comment: Same reason as discovery.
  docs-data-update:
    status: exempt
    comment: The integration fetches no data.
  docs-examples:
    status: done
    comment: alert, automation and deny-list examples in the README.
  docs-known-limitations:
    status: done
    comment: docs/known-issues.md
  docs-supported-devices:
    status: done
  docs-supported-functions:
    status: done
  docs-troubleshooting:
    status: done
    comment: >-
      Symptom-to-cause table in the README, plus the debug logger snippet
      and a pointer to the entry's diagnostics download.
  docs-use-cases:
    status: done
  dynamic-devices:
    status: exempt
    comment: One entry is one player; there is nothing to discover dynamically.
  entity-category:
    status: exempt
    comment: The notify entity is the entry's primary entity, not a config/diagnostic one.
  entity-device-class:
    status: exempt
    comment: Notify entities have no device classes.
  entity-disabled-by-default:
    status: exempt
    comment: The single entity is the point of the integration.
  entity-translations:
    status: exempt
    comment: >-
      The single entity is named after its device (_attr_has_entity_name
      with _attr_name = None), which is the intent: one entry is one player,
      and the entity should read as that player. Entity._name_internal
      returns _attr_name before it ever looks a translation key up, so an
      entity.notify.* section would be dead weight; it was removed from
      strings.json and the three translations rather than left as a promise
      the entity cannot keep. Everything the user does see — config and
      options steps, selectors, exception messages — is translated.
  exception-translations:
    status: done
  icon-translations:
    status: done
    comment: >-
      icons.json gives the notify entity its own icon, keyed on
      _attr_translation_key. The key names the icon only: _attr_name = None
      short-circuits Entity._name_internal before any name lookup.
  reconfiguration-flow:
    status: done
    comment: >-
      async_step_reconfigure changes the media_player and the TTS entity
      through async_update_entry, letting the entry's own update listener
      perform the single reload. The unique id follows the new player (one
      entry per player still); the entry title, and therefore the legacy
      notify service name an alert refers to, does not move. Both
      suitability checks of the user step apply, including the stored
      music_assistant strategy against the new player.
  repair-issues:
    status: todo
    comment: >-
      A target that is gone for good leaves the entry retrying setup and
      the entity unavailable, both visible, but no repair issue offers the
      fix (reconfigure the entry onto an entity that exists).
  stale-devices:
    status: exempt
    comment: The device is created from the entry, and removed with it.

  # Platinum
  async-dependency:
    status: done
    comment: Everything is native async; no executor jobs are scheduled.
  inject-websession:
    status: exempt
    comment: No HTTP client of its own.
  strict-typing:
    status: done
    comment: mypy --strict passes over custom_components/airplay_notifier.
